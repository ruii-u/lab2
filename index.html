<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Tank</title>
    <link rel="stylesheet" href="css/style.css">



</head>


<body>  

    <h1>Fish Tank</h1>
    <p> have as many fish as you like!</p>

    <div id="tank">
        <div id="food"></div>
        <div id="fish">🐟🐠🐡🎣</div>
    </div>
    <p id="status">The fish is hungry! They need to be fed.</p>

    <button id="feedButton" type="button">Feed</button>

    <button id="cleanButton" type="button">Clean tank</button>

    <button id="addButton" type="button">Add a fish</button>
    
    <button id="helpButton" type="button">Tank instructions</button>

    



<script src="script.js"></script>
</body>




</html>
